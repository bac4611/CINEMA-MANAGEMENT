name: Cinema build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinema-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Java 21 application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            backend/pom.xml

      # Tests use the existing H2 test configuration, never the local SQL Server.
      # Maven also packages frontend/templates and frontend/static into the JAR.
      - name: Test and package
        run: bash ./mvnw --batch-mode --no-transfer-progress -pl backend -am verify

      - name: Upload application package
        uses: actions/upload-artifact@v7
        with:
          name: cinema-backend-${{ github.sha }}
          path: |
            backend/target/*.jar
            backend/target/native/*.dll
          if-no-files-found: error
          retention-days: 7

      # Add a deployment job only after a hosting target and its secrets are configured.
