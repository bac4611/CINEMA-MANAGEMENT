spring.application.name=cinema-spring

# Local SQL Server Express uses Windows Authentication. TCP/IP is enabled on
# port 1433 and Maven places the matching authentication DLL on java.library.path.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=MovieTicketDB;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
# MovieTicketDB already has its schema. Do not let Hibernate alter it at startup.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT
security.jwt.issuer=${JWT_ISSUER:cosmos-cinema}
security.jwt.audience=${JWT_AUDIENCE:cosmos-cinema-api}
security.jwt.key=${JWT_KEY:}
security.jwt.expires-minutes=${JWT_EXPIRES_MINUTES:15}
