# Required environment overrides replace the Windows-only development datasource.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
security.jwt.key=${JWT_KEY}

server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Only accept traffic from the trusted host reverse proxy (Compose binds loopback).
server.forward-headers-strategy=framework

# Keep all management endpoints off the application port and host network.
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Deployment health must include DB connectivity; SMTP is an optional feature.
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
