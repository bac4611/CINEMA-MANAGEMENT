<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="scripts"><script>document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('form[data-validate]').forEach(form=>form.addEventListener('submit',event=>{if(!form.checkValidity()){event.preventDefault();event.stopPropagation()}form.classList.add('was-validated')}))});</script></th:block>
