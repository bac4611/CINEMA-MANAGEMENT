<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::link}, ~{::main}, ~{::script})}">
<head><title>Đặt lại mật khẩu - COSMOS Cinema</title><link rel="stylesheet" th:href="@{/css/auth.css}"></head>
<body><main>
    <section class="auth-wrapper auth-page-login"><div class="auth-shell max-w-7xl mx-auto"><div class="auth-form-panel">
        <div class="auth-form-heading"><p class="auth-form-kicker">COSMOS CINEMA</p><h2>Đặt lại mật khẩu</h2>
            <p>Tạo mật khẩu mới cho tài khoản COSMOS của bạn.</p></div>
        <form class="auth-form" th:action="@{/Account/ResetPassword}" th:object="${resetPassword}" method="post" novalidate>
            <input type="hidden" th:field="*{userId}"><input type="hidden" th:field="*{token}">
            <div class="auth-validation-summary" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">Liên kết không hợp lệ</p>
            </div>
            <div class="auth-field"><label for="passwordInput" class="auth-label">Mật khẩu mới</label>
                <div class="auth-input-frame"><span class="auth-input-icon" aria-hidden="true">●</span>
                    <input id="passwordInput" th:field="*{newPassword}" type="password" class="form-control auth-input" autocomplete="new-password">
                    <button class="auth-password-toggle" id="togglePassword" type="button">◉</button></div>
                <small class="auth-helper">Ít nhất 8 ký tự, gồm chữ hoa, số và ký tự đặc biệt.</small>
                <span class="auth-field-error" th:errors="*{newPassword}"></span>
            </div>
            <div class="auth-field"><label for="confirmPasswordInput" class="auth-label">Nhập lại mật khẩu mới</label>
                <div class="auth-input-frame"><span class="auth-input-icon" aria-hidden="true">✓</span>
                    <input id="confirmPasswordInput" th:field="*{confirmPassword}" type="password" class="form-control auth-input" autocomplete="new-password"></div>
                <small id="confirmPasswordError" class="auth-field-error"></small>
                <span class="auth-field-error" th:errors="*{confirmPassword}"></span>
            </div>
            <button type="submit" class="btn btn-submit">Đặt lại mật khẩu</button>
        </form>
    </div></div></section>
</main><script th:src="@{/js/auth.js}"></script></body></html>
