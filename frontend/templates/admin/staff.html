<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::title}, 'staff', ~{::main}, ~{::script})}">
<head><title>Quản lý nhân viên - Cosmos Cinema</title></head><body>
<main class="space-y-7">
  <div class="flex flex-wrap items-end justify-between gap-4 border-b border-outline-variant/30 pb-6"><div><h1 class="font-display text-5xl font-bold">Quản lý nhân viên</h1><p class="mt-2 text-on-surface-variant">Quản lý tài khoản Staff của Cosmos Cinema.</p></div><button type="button" onclick="toggleAdminModal('createStaffModal',true)" class="flex items-center gap-2 rounded-lg bg-primary-container px-6 py-3 font-mono text-sm text-on-primary-container"><span class="material-symbols-outlined">person_add</span>Thêm nhân viên</button></div>
  <div th:if="${successMessage}" class="rounded border border-primary/30 bg-primary/10 p-3 text-primary" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="rounded border border-error/30 bg-error/10 p-3 text-error" th:text="${errorMessage}"></div>
  <section class="overflow-hidden rounded-xl border border-outline-variant/30 bg-surface-container-low"><div class="overflow-x-auto"><table class="w-full min-w-[800px] text-left"><thead class="bg-surface-container"><tr class="border-b border-outline-variant/40"><th class="p-4 font-mono text-xs uppercase">Staff ID</th><th class="p-4 font-mono text-xs uppercase">Họ tên</th><th class="p-4 font-mono text-xs uppercase">Email</th><th class="p-4 font-mono text-xs uppercase">Điện thoại</th><th class="p-4 font-mono text-xs uppercase">Trạng thái</th><th class="p-4 text-right font-mono text-xs uppercase">Thao tác</th></tr></thead>
    <tbody><tr th:each="s : ${staff}" class="border-b border-outline-variant/20 hover:bg-surface-variant/20" th:classappend="${!s.status} ? ' opacity-60'"><td class="p-4 font-mono text-tertiary" th:text="|EMP-${#numbers.formatInteger(s.userId,3)}|">EMP-001</td><td class="p-4"><span class="mr-3 inline-flex h-8 w-8 items-center justify-center rounded-full border border-outline-variant bg-surface-container-high text-xs text-primary" th:text="${#strings.substring(s.fullName,0,1).toUpperCase()}">S</span><span th:text="${s.fullName}"></span></td><td class="p-4 text-on-surface-variant" th:text="${s.email}"></td><td class="p-4 font-mono text-sm" th:text="${#strings.isEmpty(s.phoneNumber) ? 'N/A' : s.phoneNumber}"></td><td class="p-4"><span class="rounded-full border px-3 py-1 text-xs" th:classappend="${s.status} ? ' border-primary/20 bg-primary/10 text-primary' : ' border-outline-variant text-on-surface-variant'" th:text="${s.status ? 'Active' : 'Off-Duty'}"></span></td><td class="p-4 text-right"><button type="button" class="text-on-surface-variant hover:text-primary" th:attr="data-user-id=${s.userId},data-full-name=${s.fullName},data-email=${s.email},data-phone-number=${s.phoneNumber},data-dob=${s.dateOfBirth}" onclick="openEditStaffModal(this)"><span class="material-symbols-outlined">edit</span></button></td></tr><tr th:if="${#lists.isEmpty(staff)}"><td colspan="6" class="p-8 text-center text-on-surface-variant">Không có nhân viên nào.</td></tr></tbody></table></div>
    <footer class="flex flex-wrap items-center justify-between gap-4 border-t border-outline-variant/30 p-4 font-mono text-xs"><span th:text="|Tổng số ${totalCount} nhân viên · Trang ${currentPage}/${totalPages}|">0 nhân viên</span><div class="flex gap-2"><a th:if="${currentPage > 1}" th:href="@{/Admin/Staff(page=${currentPage - 1})}" class="rounded border border-outline-variant px-3 py-1">Prev</a><span th:unless="${currentPage > 1}" class="rounded border border-outline-variant px-3 py-1 opacity-40">Prev</span><a th:if="${currentPage < totalPages}" th:href="@{/Admin/Staff(page=${currentPage + 1})}" class="rounded border border-outline-variant px-3 py-1">Next</a><span th:unless="${currentPage < totalPages}" class="rounded border border-outline-variant px-3 py-1 opacity-40">Next</span></div></footer>
  </section>
  <div id="createStaffModal" class="admin-modal fixed inset-0 z-50 grid place-items-center bg-black/80 p-4" hidden><div class="w-full max-w-2xl rounded-xl border border-outline-variant bg-surface-container p-7"><div class="mb-5 flex justify-between"><h2 class="font-display text-2xl">Tạo tài khoản nhân viên</h2><button type="button" onclick="toggleAdminModal('createStaffModal',false)">✕</button></div><form th:action="@{/Admin/CreateStaff}" th:object="${createStaff}" method="post" class="space-y-4"><input type="hidden" name="page" th:value="${currentPage}"><div th:if="${#fields.hasAnyErrors()}" class="auth-field-error"><p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p></div><label class="block text-sm">Họ tên<input th:field="*{fullName}" class="cinematic-input block w-full p-2" required></label><label class="block text-sm">Email<input th:field="*{email}" type="email" class="cinematic-input block w-full p-2" required></label><label class="block text-sm">Số điện thoại<input th:field="*{phoneNumber}" class="cinematic-input block w-full p-2"></label><label class="block text-sm">Mật khẩu<input th:field="*{password}" type="password" class="cinematic-input block w-full p-2" required></label><label class="block text-sm">Ngày sinh<input th:field="*{dateOfBirth}" type="date" class="cinematic-input block w-full p-2"></label><div class="flex justify-end gap-3 pt-3"><button type="button" onclick="toggleAdminModal('createStaffModal',false)" class="rounded border border-outline-variant px-5 py-2">Hủy</button><button class="rounded bg-primary-container px-5 py-2">Tạo tài khoản</button></div></form></div></div>
  <div id="editStaffModal" class="admin-modal fixed inset-0 z-50 grid place-items-center bg-black/80 p-4" hidden><div class="w-full max-w-2xl rounded-xl border border-outline-variant bg-surface-container p-7"><div class="mb-5 flex justify-between"><h2 class="font-display text-2xl">Chỉnh sửa nhân viên</h2><button type="button" onclick="toggleAdminModal('editStaffModal',false)">✕</button></div><form th:action="@{/Admin/UpdateStaff}" th:object="${updateStaff}" method="post" class="space-y-4"><input id="editUserId" th:field="*{userId}" type="hidden"><input type="hidden" name="page" th:value="${currentPage}"><div th:if="${#fields.hasAnyErrors()}" class="auth-field-error"><p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p></div><label class="block text-sm">Họ tên<input id="editFullName" th:field="*{fullName}" class="cinematic-input block w-full p-2" required></label><label class="block text-sm">Email<input id="editEmail" th:field="*{email}" type="email" class="cinematic-input block w-full p-2" required></label><label class="block text-sm">Số điện thoại<input id="editPhoneNumber" th:field="*{phoneNumber}" class="cinematic-input block w-full p-2"></label><label class="block text-sm">Mật khẩu mới<input id="editPassword" th:field="*{password}" type="password" class="cinematic-input block w-full p-2" placeholder="Để trống nếu không đổi"></label><label class="block text-sm">Ngày sinh<input id="editDateOfBirth" th:field="*{dateOfBirth}" type="date" class="cinematic-input block w-full p-2"></label><div class="flex justify-end gap-3 pt-3"><button type="button" onclick="toggleAdminModal('editStaffModal',false)" class="rounded border border-outline-variant px-5 py-2">Hủy</button><button class="rounded bg-primary-container px-5 py-2">Lưu thay đổi</button></div></form></div></div>
</main>
<script th:inline="javascript">
function toggleAdminModal(id,show){document.getElementById(id).hidden=!show}
function openEditStaffModal(button){const d=button.dataset;document.getElementById('editUserId').value=d.userId||'';document.getElementById('editFullName').value=d.fullName||'';document.getElementById('editEmail').value=d.email||'';document.getElementById('editPhoneNumber').value=d.phoneNumber||'';document.getElementById('editDateOfBirth').value=d.dob||'';document.getElementById('editPassword').value='';toggleAdminModal('editStaffModal',true)}
document.addEventListener('DOMContentLoaded',()=>{const modal=/*[[${openModal}]]*/ null;if(modal==='create')toggleAdminModal('createStaffModal',true);if(modal==='edit')toggleAdminModal('editStaffModal',true)});
</script></body></html>
