<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/booking :: layout(~{::title}, ~{::main}, ~{::script})}">
<head><title>Thanh toán thành công - Cosmos Cinema</title></head>
<body>
<main class="payment-success-page" th:with="b=${booking},ticket=${#lists.isEmpty(booking.tickets) ? null : booking.tickets[0]}">
  <div class="shell">
    <section class="card success-receipt">
      <header class="success-receipt__header">
        <div class="success-receipt__check" aria-hidden="true">✓</div>
        <p class="eyebrow">Thanh toán thành công</p>
        <h1>Cảm ơn bạn đã đặt vé!</h1>
        <p class="success-order-number">Mã đơn: <strong th:text="|#${#numbers.formatInteger(b.bookingId,6)}|"></strong></p>
      </header>
      <div class="success-receipt__grid">
        <section class="success-movie" aria-label="Thông tin vé">
          <h2 th:text="${ticket == null ? 'COSMOS Cinema' : ticket.showtime.movie.title}"></h2>
          <dl class="success-details" th:if="${ticket != null}">
            <div><dt>Ngày chiếu</dt><dd th:text="${#temporals.format(ticket.showtime.date,'dd/MM/yyyy')}"></dd></div>
            <div><dt>Giờ chiếu</dt><dd th:text="${#temporals.format(ticket.showtime.startTime,'HH:mm')}"></dd></div>
            <div><dt>Ghế</dt><dd th:text="${#strings.listJoin(b.tickets.![seat.seatCode], ', ')}"></dd></div>
          </dl>
          <section class="success-tickets" th:if="${!#lists.isEmpty(b.tickets)}" aria-labelledby="ticket-codes-title">
            <h3 id="ticket-codes-title">Mã vé</h3>
            <ul class="success-ticket-list">
              <li th:each="item : ${b.tickets}">
                <span class="success-ticket-seat" th:text="|Ghế ${item.seat.seatCode}|"></span>
                <code th:text="${item.ticketCode}"></code>
              </li>
            </ul>
          </section>
          <section class="success-combos" th:if="${!#lists.isEmpty(b.bookingCombos)}">
            <h3>Bắp nước</h3>
            <p th:each="item : ${b.bookingCombos}" th:text="|${item.quantity} × ${item.combo.comboName}|"></p>
          </section>
        </section>
        <aside class="success-summary" aria-label="Tổng quan thanh toán">
          <div class="success-booked-at"><span>Thời gian đặt</span><strong th:text="${#temporals.format(b.bookingDate,'dd/MM/yyyy HH:mm')}"></strong></div>
          <div class="success-amount"><span>Tổng thanh toán</span><strong th:text="${#numbers.formatDecimal(b.totalAmount,0,'POINT',0,'COMMA')} + ' ₫'"></strong></div>
          <span class="success-status" th:text="${b.status}"></span>
          <div class="success-actions">
            <a th:href="@{/home}" class="primary-button full">Về trang chủ</a>
            <a th:href="@{/account/profile}" class="secondary-button full">Xem vé của tôi</a>
          </div>
        </aside>
      </div>
    </section>
  </div>
</main>
<script></script>
</body></html>
