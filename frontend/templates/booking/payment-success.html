<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/booking :: layout(~{::title}, ~{::main}, ~{::script})}"><head><title>Thanh toán thành công - Cosmos Cinema</title></head><body>
<main class="payment-success-page" th:with="b=${booking},ticket=${#lists.isEmpty(booking.tickets) ? null : booking.tickets[0]}"><div class="shell"><section class="card" style="max-width:900px;margin:4rem auto;padding:2rem"><div style="text-align:center"><div style="font-size:4rem">✓</div><p class="eyebrow">Thanh toán thành công</p><h1>Cảm ơn bạn đã đặt vé!</h1><p>Mã đơn: <strong class="font-mono" th:text="|#${#numbers.formatInteger(b.bookingId,6)}|"></strong></p></div><div class="content-summary-grid" style="margin-top:2rem"><div><h2 th:text="${ticket == null ? 'COSMOS Cinema' : ticket.showtime.movie.title}"></h2><dl class="summary-details" th:if="${ticket != null}"><div><dt>Ngày chiếu</dt><dd th:text="${#temporals.format(ticket.showtime.date,'dd/MM/yyyy')}"></dd></div><div><dt>Giờ chiếu</dt><dd th:text="${#temporals.format(ticket.showtime.startTime,'HH:mm')}"></dd></div><div><dt>Ghế</dt><dd th:text="${#strings.listJoin(b.tickets.![seat.seatCode], ', ')}"></dd></div><div><dt>Mã vé</dt><dd th:text="${#strings.listJoin(b.tickets.![ticketCode], ', ')}"></dd></div></dl><div th:if="${!#lists.isEmpty(b.bookingCombos)}"><h3>Bắp nước</h3><p th:each="item : ${b.bookingCombos}" th:text="|${item.quantity} × ${item.combo.comboName}|"></p></div></div><aside class="booking-order-summary"><p>Thời gian đặt</p><strong th:text="${#temporals.format(b.bookingDate,'dd/MM/yyyy HH:mm')}"></strong><div class="summary-total"><span>Tổng thanh toán</span><strong th:text="${#numbers.formatDecimal(b.totalAmount,0,'POINT',0,'COMMA')} + ' ₫'"></strong></div><span class="meta-pill" th:text="${b.status}"></span><a th:href="@{/Home/Index}" class="primary-button full">Về trang chủ</a><a th:href="@{/Account/Profile}" class="secondary-button full">Xem vé của tôi</a></aside></div></section></div></main><script></script></body></html>
