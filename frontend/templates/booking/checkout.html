<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/booking :: layout(~{::title}, ~{::main}, ~{::script})}">
<head><title>Xác nhận đặt vé - Cosmos Cinema</title></head><body>
<main th:with="b=${booking}">
  <header class="site-header"><div class="shell header-row"><a th:href="@{/Home/Index}" class="brand"><span class="brand-mark"></span><span>COSMOS</span></a><div class="booking-header-actions"><div th:replace="~{booking/_booking-timer :: timer(${b.bookingExpiresAtUtc})}"></div><form th:action="@{/Booking/CancelBooking}" method="post"><button class="cancel-button">Hủy đặt vé</button></form></div></div></header>
  <div class="shell"><div class="step-heading"><div><p class="eyebrow">Bước 4 · Xác nhận</p><h1>Kiểm tra đơn hàng</h1><p class="subtitle">Kiểm tra thông tin trước khi chuyển sang thanh toán.</p></div></div><div th:if="${paymentError}" class="booking-alert" th:text="${paymentError}"></div>
    <div class="content-summary-grid"><section class="card checkout-card"><h2 th:text="${b.movieTitle}"></h2><div class="checkout-detail"><strong>Suất chiếu</strong><span th:text="|${b.selectedDate} · ${b.selectedTime} · ${b.cinemaFormat}|"></span></div><div class="checkout-detail"><strong>Ghế</strong><span th:text="${#strings.listJoin(b.selectedSeats, ', ')}"></span></div><h3>Chi tiết thanh toán</h3><div class="total-line"><span>Vé</span><strong th:text="${#numbers.formatDecimal(b.ticketSubtotal,0,'POINT',0,'COMMA')} + ' ₫'"></strong></div>
      <div th:each="item : ${b.concessions}" th:if="${item.selectedQuantity > 0}" class="checkout-detail"><span th:text="|${item.selectedQuantity} × ${item.name}|"></span><strong th:text="${#numbers.formatDecimal(item.price.doubleValue() * item.selectedQuantity,0,'POINT',0,'COMMA')} + ' ₫'"></strong></div>
      </section>
      <aside class="card booking-order-summary"><h2>Tổng thanh toán</h2><div class="summary-total"><span>Thành tiền</span><strong th:text="${#numbers.formatDecimal(b.grandTotal,0,'POINT',0,'COMMA')} + ' ₫'"></strong></div><form th:action="@{/Booking/StartPayment}" method="post"><button class="primary-button full">Thanh toán bằng QR →</button></form><a th:href="@{/Booking/SelectConcessions}" class="secondary-button full">← Quay lại</a><p class="summary-secure">🔒 Giao dịch được bảo mật.</p></aside></div>
  </div>
</main><script></script></body></html>
