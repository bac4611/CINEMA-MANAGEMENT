<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::link}, ~{::main}, ~{::script})}">
<head><title>Quên mật khẩu - COSMOS Cinema</title><link rel="stylesheet" th:href="@{/css/auth.css}"></head>
<body><main>
    <section class="auth-wrapper auth-page-login"><div class="auth-shell max-w-7xl mx-auto"><div class="auth-form-panel">
        <div class="auth-form-heading"><p class="auth-form-kicker">COSMOS CINEMA</p><h2>Khôi phục tài khoản</h2>
            <p>Nhập email để nhận hướng dẫn đặt lại mật khẩu.</p></div>
        <form class="auth-form" th:action="@{/Account/ForgotPassword}" th:object="${forgotPassword}" method="post" novalidate>
            <div class="auth-validation-summary" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">Lỗi</p>
            </div>
            <div class="auth-field"><label for="forgot-email" class="auth-label">Địa chỉ email</label>
                <div class="auth-input-frame"><span class="auth-input-icon" aria-hidden="true">✉</span>
                    <input id="forgot-email" th:field="*{email}" type="email" class="form-control auth-input"
                           autocomplete="email" placeholder="damxuanbac@example.com"></div>
                <span class="auth-field-error" th:errors="*{email}"></span>
            </div>
            <button type="submit" class="btn btn-submit">Gửi hướng dẫn</button>
        </form>
        <p class="auth-switch-copy"><a th:href="@{/Account/Login}">Quay lại đăng nhập</a></p>
    </div></div></section>
</main><script></script></body></html>
