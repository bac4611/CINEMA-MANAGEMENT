<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin :: layout(~{::title}, 'analytics', ~{::main}, ~{::script})}">
<head><title>Phân tích doanh thu - Cosmos Cinema</title></head><body>
<main th:with="a=${analytics}" class="space-y-8">
  <div class="border-b border-outline-variant/30 pb-6"><h1 class="font-display text-5xl font-bold">Phân tích doanh thu</h1><p class="mt-2 text-on-surface-variant">Theo dõi hiệu quả kinh doanh của rạp.</p></div>
  <form th:action="@{/Admin/Analytics}" method="get" class="flex flex-wrap gap-4 rounded-xl border border-outline-variant/30 bg-surface-container p-5"><select name="month" class="rounded bg-surface-variant px-4 py-2"><option value="">Tất cả tháng</option><option th:each="m : ${a.months}" th:value="${m.value}" th:text="${m.text}" th:selected="${m.value == a.selectedMonth}"></option></select><select name="movieId" class="rounded bg-surface-variant px-4 py-2"><option value="">Tất cả phim</option><option th:each="movie : ${a.movies}" th:value="${movie.movieId}" th:text="${movie.title}" th:selected="${movie.movieId == a.selectedMovieId}"></option></select><button class="rounded bg-primary-container px-5 py-2 font-mono text-sm">Lọc dữ liệu</button><a th:if="${a.selectedMonth != null or a.selectedMovieId != null}" th:href="@{/Admin/Analytics}" class="px-4 py-2 text-primary">Xóa lọc</a></form>
  <div class="grid gap-5 md:grid-cols-4"><article class="rounded-xl bg-surface-container p-6"><span class="material-symbols-outlined text-primary">payments</span><p class="mt-3 text-sm text-on-surface-variant">Tổng doanh thu</p><strong class="font-display text-3xl" th:text="${#numbers.formatDecimal(a.totalRevenue,0,'POINT',0,'COMMA')} + ' ₫'">0 ₫</strong></article><article class="rounded-xl bg-surface-container p-6"><span class="material-symbols-outlined text-secondary">confirmation_number</span><p class="mt-3 text-sm text-on-surface-variant">Vé đã bán</p><strong class="font-display text-3xl" th:text="${#numbers.formatInteger(a.totalTicketsSold,0,'POINT')}">0</strong></article><article class="rounded-xl bg-surface-container p-6"><span class="material-symbols-outlined text-tertiary">receipt_long</span><p class="mt-3 text-sm text-on-surface-variant">Đơn xác nhận</p><strong class="font-display text-3xl" th:text="${#numbers.formatInteger(a.confirmedBookings,0,'POINT')}">0</strong></article><article class="rounded-xl bg-surface-container p-6"><span class="material-symbols-outlined text-primary">monitoring</span><p class="mt-3 text-sm text-on-surface-variant">Doanh thu/vé</p><strong class="font-display text-3xl" th:text="${#numbers.formatDecimal(a.averageRevenuePerTicket,0,'POINT',0,'COMMA')} + ' ₫'">0 ₫</strong></article></div>
  <section class="rounded-xl border border-outline-variant/30 bg-surface-container p-7"><h2 class="font-display text-2xl">Doanh thu theo tháng</h2><div th:if="${#lists.isEmpty(a.revenueByMonth)}" class="py-12 text-center text-on-surface-variant">Chưa có dữ liệu.</div><div th:unless="${#lists.isEmpty(a.revenueByMonth)}" class="mt-6 space-y-4"><div th:each="item : ${a.revenueByMonth}" class="grid grid-cols-[100px_1fr_140px] items-center gap-4"><span th:text="${item.label}"></span><div class="h-3 overflow-hidden rounded bg-surface-variant"><div class="h-full rounded bg-primary" th:style="|width:${a.totalRevenue.signum() == 0 ? 0 : item.revenue.doubleValue() * 100 / a.totalRevenue.doubleValue()}%|"></div></div><span class="text-right font-mono text-sm" th:text="${#numbers.formatDecimal(item.revenue,0,'POINT',0,'COMMA')} + ' ₫'"></span></div></div></section>
  <section class="rounded-xl border border-outline-variant/30 bg-surface-container p-7"><h2 class="font-display text-2xl">Doanh thu theo phim</h2><div class="mt-5 overflow-x-auto"><table class="w-full"><thead><tr class="border-b border-outline-variant"><th class="p-3 text-left">Phim</th><th class="p-3 text-right">Doanh thu</th></tr></thead><tbody><tr th:each="item : ${a.revenueByMovie}" class="border-b border-outline-variant/20"><td class="p-3" th:text="${item.movieTitle}"></td><td class="p-3 text-right font-mono" th:text="${#numbers.formatDecimal(item.revenue,0,'POINT',0,'COMMA')} + ' ₫'"></td></tr></tbody></table></div></section>
</main><script></script></body></html>
