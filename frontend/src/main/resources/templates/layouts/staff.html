<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, activeTab, content, scripts)"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:replace="${title}">Staff - Cosmos Cinema</title><meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}"><meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}"><link rel="icon" th:href="@{/images/common/cosmos.png}"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;700&amp;family=Manrope:wght@300;400;500;700&amp;family=JetBrains+Mono&amp;display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/staff.css}"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="sidebar-header"><span class="logo-cosmos">COSMOS</span><span class="logo-cinema">CINEMA</span></div><nav class="sidebar-nav" th:with="tab=${activeTab}"><span class="nav-section-title">GIAO DIỆN QUẢN LÝ<br>DÀNH CHO STAFF</span><a th:href="@{/Staff/Index}" class="nav-item" th:classappend="${tab == 'scheduling'} ? ' active'">▣ LỊCH CHIẾU PHIM</a><a th:href="@{/Staff/Halls}" class="nav-item" th:classappend="${tab == 'halls'} ? ' active'">▤ QUẢN LÝ RẠP CHIẾU</a><a th:href="@{/Staff/Concessions}" class="nav-item" th:classappend="${tab == 'concessions'} ? ' active'">☕ QUẢN LÝ CỬA HÀNG</a></nav><div class="sidebar-footer"><div class="staff-profile-card"><div class="staff-profile-avatar" th:text="${session.UserFullName == null ? 'S' : #strings.substring(session.UserFullName,0,1).toUpperCase()}">S</div><div class="staff-profile-copy"><strong th:text="${session.UserFullName ?: 'Staff Ops'}"></strong><span th:text="${session.UserRole == 'Admin' ? 'MASTER CONTROL' : 'STAFF CONTROL'}"></span></div><form th:action="@{/Account/Logout}" method="post"><button class="staff-logout-button" aria-label="Đăng xuất">⇥</button></form></div></div></aside><div class="main-area"><div th:replace="${content}"></div></div></div><script th:src="@{/js/site.js}"></script><th:block th:replace="${scripts}"></th:block></body></html>
