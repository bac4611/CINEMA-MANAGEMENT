<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/booking :: layout(~{::title}, ~{::main}, ~{::script})}"><head><title>Chọn ghế - Cosmos Cinema</title></head><body>
<main th:with="b=${booking}"><header class="site-header"><div class="shell header-row"><a th:href="@{/Home/Index}" class="brand"><span class="brand-mark"></span><span>COSMOS</span></a><div class="booking-header-actions"><div th:replace="~{booking/_booking-timer :: timer(${b.bookingExpiresAtUtc})}"></div><form th:action="@{/Booking/CancelBooking}" method="post"><button class="cancel-button">Hủy đặt vé</button></form></div></div></header>
  <div class="shell"><div class="step-heading"><div><p class="eyebrow">Bước 2 · Chọn ghế</p><h1 th:text="${b.movieTitle}"></h1><div class="movie-meta"><span class="meta-pill" th:text="${b.selectedDate}"></span><span class="meta-pill" th:text="${b.selectedTime}"></span><span class="meta-pill" th:text="${b.cinemaFormat}"></span></div></div></div><div th:if="${alertError}" class="booking-alert" th:text="${alertError}"></div>
    <div class="content-summary-grid"><section class="seat-card card"><div class="screen-wrap"><div class="screen"></div><span class="screen-label">MÀN HÌNH</span></div><div class="seat-matrix" id="seatMatrix"><button th:each="seat : ${b.seatChoices}" type="button" class="seat" th:classappend="| ${seat.seatType.toLowerCase()}${seat.occupied ? ' occupied' : ''}${seat.selected ? ' selected' : ''}|" th:disabled="${seat.occupied}" th:attr="data-seat-id=${seat.seatId},data-seat-code=${seat.seatCode},data-price=${seat.price}" th:text="${seat.seatCode}"></button></div><div class="legend"><span><i class="regular"></i>Thường</span><span><i class="vip-key"></i>VIP</span><span><i class="sweet-key"></i>Sweetbox</span><span><i class="selected-key"></i>Đã chọn</span></div></section>
      <aside class="card booking-order-summary"><h2>Thông tin vé</h2><div id="selectedSeatList"><p th:if="${#lists.isEmpty(b.selectedSeats)}" class="empty-selection">Chưa chọn ghế.</p><div th:each="code : ${b.selectedSeats}" class="checkout-detail" th:attr="data-selected-code=${code}"><span th:text="|Ghế ${code}|"></span><strong th:text="${#numbers.formatDecimal(b.seatPrice(code),0,'POINT',0,'COMMA')} + ' ₫'"></strong></div></div><div class="total-line"><span>Số ghế</span><strong id="seatCount" th:text="${#lists.size(b.selectedSeats)}"></strong></div><div class="total-line"><span>Tạm tính</span><strong id="ticketSubtotal" th:text="${#numbers.formatDecimal(b.ticketSubtotal,0,'POINT',0,'COMMA')} + ' ₫'"></strong></div><form th:action="@{/Booking/SelectSeats}" method="post" id="seatForm"><button type="submit" class="primary-button full">Tiếp tục chọn bắp nước →</button></form><a class="secondary-button full" th:href="@{/Booking/SelectShowtime(movieId=${b.movieId})}">← Thay đổi suất chiếu</a></aside></div>
  </div></main>
<script th:inline="javascript">document.addEventListener('DOMContentLoaded',()=>{const endpoint=/*[[@{/Booking/HoldSeat}]]*/'/Booking/HoldSeat';const form=document.getElementById('seatForm'),csrf=form.querySelector('input[name="_csrf"]');const seats=[...document.querySelectorAll('.seat:not(.occupied)')],list=document.getElementById('selectedSeatList'),count=document.getElementById('seatCount'),total=document.getElementById('ticketSubtotal');const money=n=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(n);function render(){const selected=seats.filter(s=>s.classList.contains('selected'));count.textContent=selected.length;total.textContent=money(selected.reduce((n,s)=>n+Number(s.dataset.price),0));list.innerHTML=selected.length?selected.map(s=>`<div class="checkout-detail"><span>Ghế ${s.dataset.seatCode}</span><strong>${money(Number(s.dataset.price))}</strong></div>`).join(''):'<p class="empty-selection">Chưa chọn ghế.</p>'}seats.forEach(seat=>seat.addEventListener('click',async()=>{seat.disabled=true;const select=!seat.classList.contains('selected');const body=new URLSearchParams({seatId:seat.dataset.seatId,select:String(select)});if(csrf)body.append(csrf.name,csrf.value);try{const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const data=await response.json();if(!response.ok)throw new Error(data.message);seat.classList.toggle('selected',data.selected);render()}catch(e){alert(e.message||'Không thể giữ ghế.')}finally{seat.disabled=false}}));render()});</script></body></html>
