<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/booking :: layout(~{::title}, ~{::main}, ~{::script})}"><head><title>Chọn suất chiếu - Cosmos Cinema</title></head><body>
<main th:with="b=${booking}"><header class="site-header"><div class="shell header-row"><a th:href="@{/Home/Index}" class="brand"><span class="brand-mark"></span><span>COSMOS</span></a><div class="booking-header-actions"><div th:replace="~{booking/_booking-timer :: timer(${b.bookingExpiresAtUtc})}"></div><form th:action="@{/Booking/CancelBooking}" method="post"><button class="cancel-button">Hủy đặt vé</button></form></div></div></header>
  <div class="shell"><section class="movie-hero"><div class="movie-art" th:style="|--booking-poster:url('${#strings.isEmpty(b.posterUrl) ? '/images/common/cosmos.png' : b.posterUrl}')|"><img class="movie-art__poster" th:src="${#strings.isEmpty(b.posterUrl) ? '/images/common/cosmos.png' : b.posterUrl}" th:alt="|Poster ${b.movieTitle}|"></div><div class="movie-copy"><p class="eyebrow">Bước 1 · Chọn suất chiếu</p><h1 th:text="${b.movieTitle}"></h1><dl class="facts"><dt>Đạo diễn</dt><dd th:text="${b.director}"></dd><dt>Diễn viên</dt><dd th:text="${b.cast}"></dd><dt>Thời lượng</dt><dd th:text="|${b.durationMinutes} phút · ${b.genre}|"></dd><dt>Phân loại</dt><dd th:text="${b.ageRating}"></dd><dt th:if="${!#strings.isEmpty(b.language)}">Ngôn ngữ</dt><dd th:if="${!#strings.isEmpty(b.language)}" th:text="${b.language}"></dd></dl><p class="synopsis" th:text="${b.synopsis}"></p></div></section>
    <section class="schedule-card card"><h2>Chọn định dạng và suất chiếu</h2><div th:if="${#lists.isEmpty(b.showtimeChoices)}" role="status"><p>Phim hiện chưa có suất chiếu sắp tới. Vui lòng quay lại sau hoặc chọn phim khác.</p><a th:href="@{/Booking/Index}">Xem lịch chiếu phim khác</a></div><form th:action="@{/Booking/SelectShowtime}" method="post" id="showtimeForm"><input type="hidden" name="movieId" th:value="${b.movieId}"><input type="hidden" name="format" id="selectedFormat" th:value="${b.cinemaFormat}"><input type="hidden" name="offerCode" th:value="${b.offerCode}"><div class="format-choice-grid"><button th:each="format : ${b.availableFormats}" type="button" class="format-choice" th:classappend="${format == b.cinemaFormat} ? ' selected'" th:attr="data-format=${format}"><strong th:text="${format}"></strong><span>Định dạng phim</span></button></div><div class="time-options"><label th:each="s : ${b.showtimeChoices}" class="choice time-choice" th:attr="data-format=${s.format}"><input type="radio" name="showtimeId" th:value="${s.showtimeId}" required><strong th:text="${s.time}"></strong><span th:text="|${s.date} · ${s.roomName} · ${s.format}|"></span></label></div><button type="submit" class="primary-button full" th:disabled="${#lists.isEmpty(b.showtimeChoices)}">Tiếp tục chọn ghế →</button></form></section>
  </div></main>
<script>document.addEventListener('DOMContentLoaded',()=>{const formats=[...document.querySelectorAll('[data-format].format-choice')],times=[...document.querySelectorAll('.time-choice')],input=document.getElementById('selectedFormat');function choose(f){input.value=f;formats.forEach(x=>x.classList.toggle('selected',x.dataset.format===f));times.forEach(x=>{x.hidden=x.dataset.format!==f;const radio=x.querySelector('input');radio.disabled=x.hidden;if(x.hidden){radio.checked=false;x.classList.remove('selected')}})}formats.forEach(x=>x.addEventListener('click',()=>choose(x.dataset.format)));choose(input.value||formats[0]?.dataset.format||'2D');times.forEach(x=>x.addEventListener('click',()=>times.forEach(y=>y.classList.toggle('selected',y.querySelector('input').checked))))});</script></body></html>
