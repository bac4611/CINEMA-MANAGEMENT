<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/booking :: layout(~{::title}, ~{::main}, ~{::script})}"><head><title>Chọn bắp nước - Cosmos Cinema</title></head><body>
<main th:with="b=${booking}"><header class="site-header"><div class="shell header-row"><a th:href="@{/Home/Index}" class="brand"><span class="brand-mark"></span><span>COSMOS</span></a><div class="booking-header-actions"><div th:replace="~{booking/_booking-timer :: timer(${b.bookingExpiresAtUtc})}"></div><form th:action="@{/Booking/CancelBooking}" method="post"><button class="cancel-button">Hủy đặt vé</button></form></div></div></header>
  <div class="shell"><div class="step-heading"><div><p class="eyebrow">Bước 3 · Bắp nước</p><h1>Chọn món ăn kèm</h1><p class="subtitle">Thêm bắp rang và nước uống cho buổi xem phim.</p></div></div><div class="content-summary-grid"><section class="concession-grid"><article th:each="item : ${b.concessions}" class="card concession-item" th:attr="data-combo-id=${item.id},data-price=${item.price},data-stock=${item.stockQuantity}"><div class="concession-art">🍿</div><h2 th:text="${item.name}"></h2><p th:text="${#numbers.formatDecimal(item.price,0,'POINT',0,'COMMA')} + ' ₫'"></p><p class="stock-label" th:text="|Còn ${item.stockQuantity} phần|"></p><div class="quantity-control"><button type="button" data-change="-1">−</button><strong data-quantity th:text="${item.selectedQuantity}">0</strong><button type="button" data-change="1">+</button></div></article><p th:if="${#lists.isEmpty(b.concessions)}" class="card">Hiện chưa có combo khả dụng.</p></section>
      <aside class="card booking-order-summary"><h2>Đơn hàng</h2><p th:text="${b.movieTitle}"></p><div class="total-line"><span>Vé</span><strong th:text="${#numbers.formatDecimal(b.ticketSubtotal,0,'POINT',0,'COMMA')} + ' ₫'"></strong></div><div class="total-line"><span>Bắp nước</span><strong id="concessionSubtotal" th:text="${#numbers.formatDecimal(b.concessionSubtotal,0,'POINT',0,'COMMA')} + ' ₫'"></strong></div><form th:action="@{/Booking/SelectConcessions}" method="post" id="concessionForm"><button class="primary-button full">Tiếp tục thanh toán →</button></form><a th:href="@{/Booking/SelectSeats}" class="secondary-button full">← Quay lại chọn ghế</a></aside></div>
  </div></main>
<script th:inline="javascript">document.addEventListener('DOMContentLoaded',()=>{const endpoint=/*[[@{/Booking/UpdateComboHold}]]*/'/Booking/UpdateComboHold';const form=document.getElementById('concessionForm'),csrf=form.querySelector('input[name="_csrf"]'),cards=[...document.querySelectorAll('[data-combo-id]')],subtotal=document.getElementById('concessionSubtotal'),money=n=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(n);function render(){subtotal.textContent=money(cards.reduce((sum,c)=>sum+Number(c.dataset.price)*Number(c.querySelector('[data-quantity]').textContent),0))}cards.forEach(card=>card.querySelectorAll('[data-change]').forEach(button=>button.addEventListener('click',async()=>{button.disabled=true;const body=new URLSearchParams({comboId:card.dataset.comboId,change:button.dataset.change});if(csrf)body.append(csrf.name,csrf.value);try{const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const data=await response.json();if(!response.ok)throw new Error(data.message);card.querySelector('[data-quantity]').textContent=data.quantity;card.dataset.stock=data.stockQuantity;render()}catch(e){alert(e.message||'Không thể cập nhật combo.')}finally{button.disabled=false}})));render()});</script></body></html>
