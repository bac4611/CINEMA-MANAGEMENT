<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chọn đồ ăn/uống | Cosmos Cinema</title><link rel="stylesheet" th:href="@{/css/select-concessions.css}"></head>
<body th:with="b=${booking}">
<header class="site-header"><div class="shell header-row">
<a class="brand" th:href="@{/Home/Index}"><span class="brand-mark" aria-hidden="true"></span> COSMOS CINEMA</a>
<div class="booking-header-actions"><div th:replace="~{booking/_booking-timer :: timer(${b.bookingExpiresAtUtc})}"></div>
<form th:action="@{/Booking/CancelBooking}" method="post" class="cancel-form"><button type="submit" class="cancel-button" onclick="return confirm('Bạn có chắc muốn huỷ quá trình đặt vé?');">Huỷ</button></form></div>
</div></header>
<div class="stepper-wrap"><nav class="shell stepper" aria-label="Tiến trình đặt vé">
<button type="button" class="stepper-button complete" disabled><span class="step-number">1</span><span class="step-label">Thông tin phim</span></button>
<button type="button" class="stepper-button complete" disabled><span class="step-number">2</span><span class="step-label">Ghế ngồi</span></button>
<button type="button" class="stepper-button active" aria-current="step"><span class="step-number">3</span><span class="step-label">Đồ ăn/uống</span></button>
<button type="button" class="stepper-button" disabled><span class="step-number">4</span><span class="step-label">Thanh toán</span></button>
</nav></div>
<main class="shell"><div class="booking-step active" data-step="3">
<header class="step-heading"><div><p class="eyebrow">Step 3 of 4 · Add-ons</p><h2>Nâng cao trải nghiệm</h2><p class="subtitle">Đặt Combo Bỏng nước</p></div></header>
<p class="card booking-alert" th:if="${alertError}" th:text="${alertError}" role="alert"></p>
<p class="booking-alert" id="comboError" role="alert" hidden></p>
<form th:action="@{/Booking/SelectConcessions}" method="post" id="concessionForm" class="content-summary-grid" th:attr="data-update-url=@{/Booking/UpdateComboHold},data-clear-url=@{/Booking/ClearComboHolds}">
<section class="concession-grid" aria-label="Đồ ăn và thức uống">
<article th:each="item : ${b.concessions}" class="card product-card" th:attr="data-name=${item.name},data-combo-id=${item.id},data-price=${item.price},data-stock=${item.stockQuantity}">
<input type="hidden" class="quantity-input" th:value="${item.selectedQuantity}">
<div class="product-body"><h3 th:text="${item.name}"></h3><div class="product-footer">
<div class="product-meta"><span class="price" th:text="${#numbers.formatDecimal(item.price,0,'POINT',0,'COMMA')} + ' ₫'"></span>
<span class="stock" th:classappend="${item.stockQuantity == 0} ? 'out-of-stock'" th:text="|Tồn kho: ${item.stockQuantity}|"></span></div>
<div class="quantity" th:attr="aria-label=|Số lượng ${item.name}|">
<button type="button" class="decrease" data-change="-1" aria-label="Giảm một" th:disabled="${item.selectedQuantity == 0}">−</button>
<span class="quantity-value" th:text="${item.selectedQuantity}" aria-live="polite"></span>
<button type="button" class="plus" data-change="1" aria-label="Tăng một" th:disabled="${item.selectedQuantity >= item.stockQuantity}">+</button>
</div></div></div></article>
<div class="card product-body" th:if="${#lists.isEmpty(b.concessions)}"><p>Hiện chưa có combo khả dụng. Bạn có thể bỏ qua để tiếp tục.</p></div>
</section>
<aside class="card summary-card" id="contentSummary" th:attr="data-ticket-total=${b.ticketSubtotal}">
<h3>Tổng quan đặt vé</h3><span class="summary-label" th:text="${b.movieTitle}"></span>
<div class="compact-list" id="selectedConcessionsList" aria-live="polite"></div>
<div class="totals">
<div class="total-line"><span>Vé và phí</span><span th:text="${#numbers.formatDecimal(b.ticketSubtotal,0,'POINT',0,'COMMA')} + ' ₫'"></span></div>
<div class="total-line"><span>Combo</span><span id="concessionSubtotal" th:text="${#numbers.formatDecimal(b.concessionSubtotal,0,'POINT',0,'COMMA')} + ' ₫'"></span></div>
<div class="total-line grand"><span>Tổng:</span><span id="grandTotal" th:text="${#numbers.formatDecimal(b.ticketSubtotal.add(b.concessionSubtotal),0,'POINT',0,'COMMA')} + ' ₫'"></span></div>
</div>
<div class="summary-actions"><button type="submit" class="primary-button full">Chuyển đến trang thanh toán</button>
<button type="button" class="secondary-button full" id="skipAddonsButton">Bỏ qua</button></div>
</aside></form></div></main>
<script th:src="@{/js/select-concessions.js}" defer></script></body></html>
