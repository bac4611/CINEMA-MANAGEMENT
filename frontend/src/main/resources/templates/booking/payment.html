<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/booking :: layout(~{::title}, ~{::main}, ~{::script})}"><head><title>Thanh toán - Cosmos Cinema</title></head><body>
<main th:with="p=${payment}"><header class="site-header"><div class="shell header-row"><a th:href="@{/Home/Index}" class="brand"><span class="brand-mark"></span><span>COSMOS</span></a><div class="booking-header-actions"><div th:replace="~{booking/_booking-timer :: timer(${p.expiresAtUtc})}"></div></div></div></header><div class="shell"><div class="step-heading"><div><p class="eyebrow">Thanh toán</p><h1>Quét mã QR</h1><p class="subtitle">Mở ứng dụng ngân hàng và quét mã để hoàn tất giao dịch.</p></div></div><div th:if="${paymentError}" class="booking-alert" th:text="${paymentError}"></div><div class="content-summary-grid"><section class="card checkout-card"><h2 th:text="${p.movieTitle}"></h2><div class="checkout-detail"><strong>Suất chiếu</strong><span th:text="|${p.selectedDate} · ${p.selectedTime} · ${p.cinemaFormat}|"></span></div><div class="checkout-detail"><strong>Ghế</strong><span th:text="${#strings.listJoin(p.selectedSeats, ', ')}"></span></div><div class="total-line"><span>Tiền vé</span><strong th:text="${#numbers.formatDecimal(p.ticketSubtotal,0,'POINT',0,'COMMA')} + ' ₫'"></strong></div><div class="total-line"><span>Bắp nước</span><strong th:text="${#numbers.formatDecimal(p.concessionSubtotal,0,'POINT',0,'COMMA')} + ' ₫'"></strong></div><div class="summary-total"><span>Tổng tiền</span><strong th:text="${#numbers.formatDecimal(p.totalAmount,0,'POINT',0,'COMMA')} + ' ₫'"></strong></div></section><aside class="card booking-order-summary"><img th:src="${p.qrImageUrl}" alt="Mã QR thanh toán" style="width:100%;max-width:320px;margin:auto;display:block"><dl class="summary-details"><div><dt>Nội dung chuyển khoản</dt><dd class="font-mono" th:text="${p.paymentReference}"></dd></div></dl><p id="paymentState">Đang chờ ngân hàng xác nhận...</p><form th:if="${p.showDevelopmentPaymentButton}" th:action="@{/Booking/CompleteDevPayment}" method="post"><input type="hidden" name="paymentReference" th:value="${p.paymentReference}"><button class="primary-button full">Giả lập thanh toán thành công</button></form></aside></div></div></main>
<script th:inline="javascript">document.addEventListener('DOMContentLoaded',()=>{const reference=/*[[${payment.paymentReference}]]*/'';const statusUrl=/*[[@{/Booking/PaymentStatus}]]*/'/Booking/PaymentStatus';const successUrl=/*[[@{/Booking/PaymentSuccess}]]*/'/Booking/PaymentSuccess';async function poll(){try{const response=await fetch(`${statusUrl}?paymentReference=${encodeURIComponent(reference)}`,{headers:{Accept:'application/json'}});const data=await response.json();if(data.status==='Success'&&data.bookingId){location.replace(`${successUrl}?bookingId=${data.bookingId}`);return}if(data.status==='Expired'){document.getElementById('paymentState').textContent='Phiên thanh toán đã hết hạn.';return}}catch(e){}setTimeout(poll,3000)}poll()});</script></body></html>
