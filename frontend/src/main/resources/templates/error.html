<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lỗi - COSMOS Cinema</title><link rel="stylesheet" th:href="@{/css/site.css}"><style>body{min-height:100vh;display:grid;place-items:center;background:#131313;color:#e5e2e1;font-family:Manrope,sans-serif}.error-card{max-width:680px;padding:3rem;border:1px solid #51443c;border-radius:20px;background:#201f1f;text-align:center}.error-code{font-size:5rem;color:#f4bb92;margin:0}.error-card a{display:inline-block;margin-top:1rem;padding:.8rem 1.4rem;border-radius:8px;background:#8b5e3c;color:#fff;text-decoration:none}</style></head><body><main class="error-card"><p class="error-code" th:text="${status ?: '500'}">500</p><h1>Không thể xử lý yêu cầu</h1><p th:text="${message != null and !message.isBlank() ? message : 'Đã xảy ra lỗi. Vui lòng thử lại sau.'}"></p><p th:if="${path}"><strong>Đường dẫn:</strong> <code th:text="${path}"></code></p><p th:if="${requestId}"><strong>Request ID:</strong> <code th:text="${requestId}"></code></p><a th:href="@{/Home/Index}">Về trang chủ</a></main></body></html>
